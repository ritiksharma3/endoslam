# One config to rule out "which subset am I even using" confusion across
# Kaggle sessions. Edit paths per-environment; everything else should be
# stable across the whole project.

data:
  root: "/kaggle/input/endoslam"   # change to your Colab mount path if needed
  organ: "stomach"                 # only stomach in scope for this project
  synthetic_cam: "UnityCam"        # has paired depth + pose GT
  real_cams: ["HighCam", "LowCam"] # pose GT only, real ex-vivo footage
  image_size: [320, 320]           # match UnityCam native res; downsample real cams to match
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42

dark_degradation:
  # Synthetic dark-frame formation model, y = gamma * (x conv k) + n
  # (same formulation DarkIR itself is trained against)
  gamma_range: [0.15, 0.4]     # illumination attenuation
  blur_kernel_range: [3, 9]    # simulated motion/defocus blur, odd sizes only
  noise_std_range: [0.01, 0.05]
  apply_to: ["UnityCam", "HighCam", "LowCam"]

darkir_lite:
  pretrained_checkpoint: "Cidaut/DarkIR"  # HF slug (case-sensitive) -- fine-tune from official CVPR25 weights
  width_multiplier: 0.5    # 0.5x DarkIR-l (width=64) lands exactly on the official
                            # DarkIR-m checkpoint (width=32, 3.31M params) -- "DarkIR-lite"
                            # IS DarkIR-m, real pretrained-weight fine-tuning, not a custom
                            # from-scratch architecture. See PROGRESS.md Phase 2 notes.
  freeze_encoder_epochs: 3 # freeze pretrained encoder for first N epochs, then unfreeze
  batch_size: 8
  lr: 1.0e-4  # PyYAML parses bare "1e-4" as a string, not a float -- needs the decimal point
  epochs: 20
  checkpoint_every_steps: 200   # Kaggle sessions die without warning -- save often

reconstruction:
  context_window: 8        # frames of local pose-reference window (vs LingBot-Map's full trajectory memory)
  backbone: "mobilenet_v3_small"
  depth_head_channels: 64
  batch_size: 4
  lr: 2.0e-4  # same PyYAML bare-exponent gotcha as darkir_lite.lr above
  epochs: 40
  checkpoint_every_steps: 200
  depth_loss_weight: 1.0
  pose_loss_weight: 1.0
  pose_rotation_weight: 10.0  # rotation term (radians-scale, 0..pi) vs translation L1 term
                               # (raw UnityCam world-units, uncalibrated) -- a GUESS, check the
                               # Kaggle smoke test's raw depth_loss/trans_loss/rot_loss printout
                               # before trusting this default, same as darkir_lite.lr's string bug
                               # was only caught by running the code, not reading the config.

fusion:
  # Camera model is UNCONFIRMED for UnityCam -- no intrinsics exist anywhere
  # in the EndoSLAM dataset/paper/repo. These are sourced from a Camera
  # GameObject in github.com/CapsuleEndoscope/VirtualCapsuleEndoscopy's
  # Record_scene.unity, positioned near a physics-simulated "Capsule"
  # object -- plausible (close-range near/far clip matches a capsule
  # endoscope), not 100% confirmed to be the exact camera that generated
  # this dataset variant. See PROGRESS.md "Phase 4 camera model" and
  # Step 4's GT-mode visual validation gate before trusting downstream use.
  camera_fov_deg: 91.320755
  near_clip: 0.01             # unity units
  far_clip: 2.0                # unity units
  depth_axis_y_down: true      # UNCONFIRMED -- backprojection axis convention (Unity is left-handed
                                # y-up; standard CV pinhole assumes y-down). Resolve empirically by
                                # sweeping true/false against the GT-mode reconstruction's visual shape.
  voxel_downsample: 0.002  # unity units, for Open3D point cloud downsampling -- controls point
                            # density, not signal discard, so low risk regardless of the unit hypothesis
  depth_trunc: 0.65        # unity units, discard depth beyond this. CHANGED from an earlier 0.15
                            # (meters) guess -- under the Linear01Depth hypothesis above, observed
                            # depth bytes (1-72) map to ~0.02-0.565 unity units, so 0.15 would have
                            # discarded most of the plausible signal.
  anchor_predicted_to_gt_origin: true  # world-coordinate-frame origin choice only for predicted-mode
                                        # pose chaining (no model-predicted equivalent exists for the
                                        # chain's starting pose) -- not supervision leakage, everything
                                        # inside the chain is still 100% model output.

eval:
  pose_metrics: ["ATE", "RPE"]
  depth_metrics: ["AbsRel", "RMSE", "delta1"]
  compare_conditions: ["raw_dark_input", "darkir_lite_enhanced"]

bundle_adjustment:
  # Phase 6: optional global refinement over reconstruct_video()'s full-video
  # keyframe poses (src/fusion/bundle_adjust.py), gated by --bundle-adjust
  # (default off) -- see that module's docstring and PROGRESS.md's "sliding-
  # window ICP only catches local revisits" note for why this exists.
  keyframe_stride: 8          # every Nth fused frame becomes a BA node/keyframe
  loop_closure_radius: 0.05   # unity world-units; earlier keyframes within this distance of a
                               # new keyframe's ICP-chain position become loop-closure candidates
  loop_closure_candidates: 3  # max earlier keyframes checked per new keyframe, beyond the immediately
                               # preceding one (bounds cost -- proximity search, not exhaustive pairwise)
  robust_loss: "soft_l1"      # scipy.optimize.least_squares loss= (pseudo-Huber-equivalent)
  f_scale: 1.0                # robust loss transition scale, in pixel-reprojection units
  max_nfev: 200                # TRF solver iteration cap per outer iteration, bounds Kaggle CPU runtime
  max_outer_iters: 3          # outer solve/re-filter iterations (bounded iterative optimization w/ rollback)
  mad_outlier_threshold: 3.5  # modified-z-score convention, observations beyond this get dropped between outer iters
  baseline_anchor_weight: 1.0 # gauge/scale-anchoring residual weight (keeps BA's trajectory arc length
                               # near the pre-BA ICP-chain's own, since reprojection-only BA is scale-ambiguous)
  rollback_min_improvement: 0.01  # BA must beat the pre-BA ICP-chain cost by >1%, or its result is discarded
                                    # entirely and reconstruct_video()'s existing output is returned unchanged
  ransac_scale_shift:
    enabled: true
    n_iters: 200
    inlier_threshold: 0.02    # unity depth units, same scale as fusion.voxel_downsample
